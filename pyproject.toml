[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaps-status"
version = "1.0.0"
description = "Read-only checker for whether Google Maps place, photo, and video links are still listed."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["google-maps", "threat-intelligence", "osint"]
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.40",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmaps-status = "gmaps_status.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
